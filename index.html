<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Inden Farmasi Logistik</title>
</head>
<body>
    <h1>Status Inden Farmasi Logistik</h1>
    
    <!-- 1. Button to test getting data from the Google Sheet -->
    <h3>Dapatkan Data (Get Data)</h3>
    <button onclick="fetchDashboardData()">Get Dashboard Data</button>

    <hr>

    <!-- 2. Inputs and Button to test sending an email -->
    <h3>Hantar Emel (Send Email)</h3>
    <label>Target Email:</label><br>
    <input type="email" id="emailInput" placeholder="name@example.com"><br><br>
    
    <label>Message:</label><br>
    <textarea id="messageInput" rows="3" placeholder="Sila ambil inden anda..."></textarea><br><br>
    
    <button onclick="handleSendEmail()">Send Email</button>

    <hr>

    <!-- 3. This is where the results will show up -->
    <h3>Output:</h3>
    <pre id="output">Waiting for action...</pre>

    <!-- Link to your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
