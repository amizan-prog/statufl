<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inden Data Entry</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      /* --- GAYA ASAS (MOD CERAH) --- */
      body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background-color 0.3s, color 0.3s; }
      .container { max-width: 650px; margin-top: 40px; margin-bottom: 40px; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); transition: background-color 0.3s, box-shadow 0.3s; }
      .btn-whatsapp { background-color: #25D366; color: white; font-weight: bold; width: 100%; margin-top: 20px; padding: 12px; border-radius: 8px; text-decoration: none; display: block; text-align: center; }
      .btn-whatsapp:hover { background-color: #1ebe57; color: white; }
      h2 { color: #2c3e50; font-weight: 700; }
      .form-label { font-weight: 600; color: #34495e; font-size: 0.95rem; }
      .btn-primary { background-color: #0d6efd; border: none; padding: 10px; font-weight: 600; }
      select.form-select { font-weight: bold; }

      /* --- GAYA MOD GELAP (DARK MODE) --- */
      body.dark-mode { background-color: #121212; color: #e0e0e0; }
      body.dark-mode .container { background-color: #1e1e1e; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
      body.dark-mode h2 { color: #ffffff; }
      body.dark-mode .form-label { color: #cccccc; }
      body.dark-mode .form-control, 
      body.dark-mode .form-select { background-color: #2b2b2b; color: #ffffff; border-color: #444; }
      body.dark-mode .form-control::placeholder { color: #888; }
      body.dark-mode .text-muted { color: #aaa !important; }
      body.dark-mode .input-group .btn-outline-secondary { color: #ccc; border-color: #555; }
      body.dark-mode .input-group .btn-outline-secondary:hover { background-color: #444; color: white; }
    </style>
  </head>
  <body>
    <div class="container">
      
      <!-- Tajuk & Butang Mod Gelap/Cerah -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0">Inden Data Entry</h2>
        <button id="themeToggle" class="btn btn-sm btn-outline-secondary" onclick="toggleTheme()">
          🌙 Mod Gelap
        </button>
      </div>
      
      <form id="dataForm">
        <!-- UNIT Lookup -->
        <div class="mb-4">
          <label for="unit" class="form-label">UNIT</label>
          <div class="input-group">
            <input type="text" class="form-control" id="unit" name="unit" required placeholder="e.g. ICU, W5A, DCO">
            <button class="btn btn-outline-secondary" type="button" onclick="loadUnitData()">Load Data</button>
          </div>
          <small class="text-muted">Type a unit and click 'Load Data' to edit, or just type a new one to add.</small>
        </div>

        <!-- Statuses -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="statusDrip" class="form-label">Status Inden Drip</label>
            <select class="form-select" id="statusDrip" name="statusDrip" onchange="updateSelectColor(this)">
              <option value="Inden Belum Diterima" style="background-color: #ced4da; color: black;">Inden Belum Diterima</option>
              <option value="Inden Baru Diterima" style="background-color: #0d6efd; color: white;">Inden Baru Diterima</option>
              <option value="Inden Sedang Diproses" style="background-color: #ffc107; color: black;">Inden Sedang Diproses</option>
              <option value="Inden Sedia Diambil" style="background-color: #198754; color: white;">Inden Sedia Diambil</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label for="statusBukanUbat" class="form-label">Status Inden Bukan Ubat</label>
            <select class="form-select" id="statusBukanUbat" name="statusBukanUbat" onchange="updateSelectColor(this)">
              <option value="Inden Belum Diterima" style="background-color: #ced4da; color: black;">Inden Belum Diterima</option>
              <option value="Inden Baru Diterima" style="background-color: #0d6efd; color: white;">Inden Baru Diterima</option>
              <option value="Inden Sedang Diproses" style="background-color: #ffc107; color: black;">Inden Sedang Diproses</option>
              <option value="Inden Sedia Diambil" style="background-color: #198754; color: white;">Inden Sedia Diambil</option>
            </select>
          </div>
        </div>

        <!-- Trolley Details -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="jumlahTroli" class="form-label">Jumlah Troli</label>
            <input type="number" class="form-control" id="jumlahTroli" name="jumlahTroli" placeholder="0">
          </div>
          <div class="col-md-6 mb-3">
            <label for="perluTroli" class="form-label">Perlu Troli?</label>
            <select class="form-select" id="perluTroli" name="perluTroli">
              <option value="Tidak">Tidak</option>
              <option value="Ya">Ya</option>
            </select>
          </div>
        </div>

        <!-- PIC Info -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="emailPic" class="form-label">Email PIC</label>
            <input type="email" class="form-control" id="emailPic" name="emailPic" placeholder="email@example.com">
          </div>
          <div class="col-md-6 mb-3">
            <label for="telPic" class="form-label">No. Tel PIC</label>
            <input type="text" class="form-control" id="telPic" name="telPic" placeholder="012-3456789">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-2">Save Record</button>
      </form>
      
      <!-- WhatsApp Button -->
      <a href="https://go.gov.my/statufl" target="_blank" class="btn-whatsapp">
        GROUP PHIS WHATSAPP
      </a>
      
      <!-- Status Message -->
      <div id="message" class="mt-3 text-center fw-bold"></div>
    </div>

    <!-- Frontend Logic for GitHub Pages -->
    <script>
      // URL APPS SCRIPT ANDA
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxsIg6ENtFfOrbwI_6bm2UTymOrdIoe5EVw8MSCAPrdnx-6iu6CiLWg7YKpxhNXyw2AA/exec";

      // --- FUNGSI MOD GELAP / CERAH ---
      function toggleTheme() {
        const body = document.body;
        const themeBtn = document.getElementById('themeToggle');
        
        body.classList.toggle('dark-mode');
        
        if (body.classList.contains('dark-mode')) {
          themeBtn.innerHTML = '☀️ Mod Cerah';
          themeBtn.classList.replace('btn-outline-secondary', 'btn-outline-light');
          localStorage.setItem('theme', 'dark');
        } else {
          themeBtn.innerHTML = '🌙 Mod Gelap';
          themeBtn.classList.replace('btn-outline-light', 'btn-outline-secondary');
          localStorage.setItem('theme', 'light');
        }
      }

      // --- RUN ON PAGE LOAD ---
      document.addEventListener("DOMContentLoaded", function() {
        const savedTheme = localStorage.getItem('theme');
        const themeBtn = document.getElementById('themeToggle');
        
        if (savedTheme === 'dark') {
          document.body.classList.add('dark-mode');
          themeBtn.innerHTML = '☀️ Mod Cerah';
          themeBtn.classList.replace('btn-outline-secondary', 'btn-outline-light');
        }

        updateSelectColor(document.getElementById('statusDrip'));
        updateSelectColor(document.getElementById('statusBukanUbat'));
      });

      // --- FUNGSI WARNA DROPDOWN ---
      function updateSelectColor(element) {
        const value = element.value;
        if (value === "Inden Belum Diterima") {
          element.style.backgroundColor = "#ced4da"; element.style.color = "black";
        } else if (value === "Inden Baru Diterima") {
          element.style.backgroundColor = "#0d6efd"; element.style.color = "white";
        } else if (value === "Inden Sedang Diproses") {
          element.style.backgroundColor = "#ffc107"; element.style.color = "black";
        } else if (value === "Inden Sedia Diambil") {
          element.style.backgroundColor = "#198754"; element.style.color = "white";
        }
      }

      // --- FUNGSI LOAD DATA (GUNA FETCH UNTUK GITHUB) ---
      function loadUnitData() {
        var unit = document.getElementById('unit').value.trim();
        if (!unit) {
          alert("Please enter a UNIT first.");
          return;
        }
        
        document.getElementById('message').innerText = "Loading data...";
        document.getElementById('message').className = "mt-3 text-center fw-bold text-secondary";
        
        // Menggunakan redirect: "follow" untuk elak ralat Google Script redirect
        fetch(SCRIPT_URL + "?action=getUnitData&unit=" + encodeURIComponent(unit), {
          method: "GET",
          redirect: "follow"
        })
          .then(response => {
            if (!response.ok) throw new Error("Network response was not ok");
            return response.json();
          })
          .then(data => {
            if (data) {
              document.getElementById('statusDrip').value = data.statusDrip || "Inden Belum Diterima";
              document.getElementById('statusBukanUbat').value = data.statusBukanUbat || "Inden Belum Diterima";
              document.getElementById('jumlahTroli').value = data.jumlahTroli || "";
              document.getElementById('perluTroli').value = data.perluTroli || "Tidak";
              document.getElementById('emailPic').value = data.emailPic || "";
              document.getElementById('telPic').value = data.telPic || "";
              
              document.getElementById('message').innerText = "Data loaded for " + unit;
              document.getElementById('message').className = "mt-3 text-center fw-bold text-success";
            } else {
              document.getElementById('message').innerText = "Unit not found. Fill the form to add as a new record.";
              document.getElementById('message').className = "mt-3 text-center fw-bold text-warning";
              
              document.getElementById('statusDrip').value = "Inden Belum Diterima";
              document.getElementById('statusBukanUbat').value = "Inden Belum Diterima";
              document.getElementById('jumlahTroli').value = "";
              document.getElementById('perluTroli').value = "Tidak";
              document.getElementById('emailPic').value = "";
              document.getElementById('telPic').value = "";
            }
            updateSelectColor(document.getElementById('statusDrip'));
            updateSelectColor(document.getElementById('statusBukanUbat'));
          })
          .catch(error => {
            console.error("Fetch Error:", error);
            document.getElementById('message').innerText = "Error loading data: " + error.message;
            document.getElementById('message').className = "mt-3 text-center fw-bold text-danger";
          });
      }

      // --- FUNGSI SAVE DATA (GUNA FETCH UNTUK GITHUB) ---
      document.getElementById('dataForm').addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        document.getElementById('message').innerText = "Saving...";
        document.getElementById('message').className = "mt-3 text-center fw-bold text-primary";
        document.getElementById('submitBtn').disabled = true;
        
        var formData = {
          unit: document.getElementById('unit').value.trim(),
          statusDrip: document.getElementById('statusDrip').value,
          statusBukanUbat: document.getElementById('statusBukanUbat').value,
          jumlahTroli: document.getElementById('jumlahTroli').value,
          perluTroli: document.getElementById('perluTroli').value,
          emailPic: document.getElementById('emailPic').value,
          telPic: document.getElementById('telPic').value
        };

        fetch(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8",
          },
          body: JSON.stringify({
            action: "saveData",
            formData: formData
          })
        })
        .then(response => response.json())
        .then(data => {
          document.getElementById('message').innerText = data.message;
          document.getElementById('message').className = "mt-3 text-center fw-bold text-success";
          document.getElementById('submitBtn').disabled = false;
        })
        .catch(error => {
          console.error("Save Error:", error);
          document.getElementById('message').innerText = "Error saving data: " + error.message;
          document.getElementById('message').className = "mt-3 text-center fw-bold text-danger";
          document.getElementById('submitBtn').disabled = false;
        });
      });
    </script>
  </body>
</html>
